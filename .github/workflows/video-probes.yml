name: Experimental native video probes
on:
  push:
    paths: ['scripts/video/**', 'tests/video/**', '.github/workflows/video-probes.yml']
  pull_request:
    paths: ['scripts/video/**', 'tests/video/**', '.github/workflows/video-probes.yml']
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 and ARM64 SDK probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/video-probes | Out-Null
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          $hostArch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq [System.Runtime.InteropServices.Architecture]::Arm64) { 'arm64' } else { 'amd64' }
          $targets = if ($hostArch -eq 'arm64') { @('arm64') } else { @('amd64','arm64') }
          foreach ($arch in $targets) {
            $script = Join-Path $env:RUNNER_TEMP "freelane-video-$arch.cmd"
            @('@echo off', "call `"$vs\Common7\Tools\VsDevCmd.bat`" -no_logo -host_arch=$hostArch -arch=$arch", 'if errorlevel 1 exit /b 1', "cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE /Fe:target\video-probes\probe-$arch.exe scripts\video\probe-windows.cpp mfplat.lib mfreadwrite.lib mfuuid.lib ole32.lib oleaut32.lib d3d11.lib dxgi.lib windowsapp.lib user32.lib gdi32.lib", 'if errorlevel 1 exit /b 1', "cl /nologo /std:c++20 /EHsc /W4 /MT /DUNICODE /D_UNICODE /Fe:target\video-probes\worker-$arch.exe scripts\video\worker-windows.cpp mfplat.lib mfuuid.lib ole32.lib oleaut32.lib d3d11.lib dxgi.lib windowsapp.lib user32.lib gdi32.lib", 'exit /b %errorlevel%') | Set-Content -Encoding ascii $script
            & cmd /d /c $script *> "target/video-probes/build-$arch.log"
            if ($LASTEXITCODE -ne 0) {
              Get-Content "target/video-probes/build-$arch.log" | Where-Object { $_ -match 'error C[0-9]+|fatal error|error LNK' } | Select-Object -First 10 | ForEach-Object { Write-Output "::error title=Native probe build::$_" }
              throw "Probe compilation failed: $arch"
            }
          }
      - name: Exercise owned native capture/codec and no-overwrite refusal
        shell: pwsh
        run: |
          $folder = Join-Path $PWD 'target/video-probes/generated'
          $native = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq [System.Runtime.InteropServices.Architecture]::Arm64) { 'arm64' } else { 'amd64' }
          $expected = if ($native -eq 'arm64') { 'arm64' } else { 'x86_64' }
          $exe = Join-Path $PWD "target/video-probes/probe-$native.exe"
          $p = Start-Process $exe -ArgumentList "`"$folder`"" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Owned video probe timed out' }
          if ($p.ExitCode -ne 0) { throw "Owned video probe exited $($p.ExitCode)" }
          $r = Get-Content "$folder/report.json" -Raw | ConvertFrom-Json
          Write-Output "::notice title=Windows video capability report::$($r | ConvertTo-Json -Compress)"
          if ($r.architecture -ne $expected -or $r.encoded_frames -ne 30) { throw "Reference encoding failed; HRESULT $($r.encoder_hresult)" }
          if ($r.direct_packet_count -ne 30) { throw "Direct streaming probe missing/failed; HRESULT $($r.direct_hresult)" }
          if ($r.raw_stream_pictures -ne 30 -or $r.raw_stream_configurations -ne 1 -or $r.raw_stream_idrs -lt 1 -or $r.direct_hresult -ne 0) { throw 'Direct raw packet interoperability fixture failed' }
          if ($r.captured_frames -ne 30 -or $r.captured_packets -ne 30 -or $r.captured_configurations -ne 1 -or $r.captured_hresult -ne 0) { throw "Owned captured packet pipeline failed; HRESULT $($r.captured_hresult)" }
          $before = (Get-FileHash "$folder/fixture.mp4" -Algorithm SHA256).Hash
          & $exe $folder
          if ($LASTEXITCODE -ne 2 -or (Get-FileHash "$folder/fixture.mp4" -Algorithm SHA256).Hash -ne $before) { throw 'Existing destination was not preserved' }
          $global:LASTEXITCODE = 0
      - name: Exercise persistent owned worker and bounded stalled output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq [System.Runtime.InteropServices.Architecture]::Arm64) { 'arm64' } else { 'amd64' }
          $exe = Join-Path $PWD "target/video-probes/worker-$native.exe"
          $folder = Join-Path $PWD 'target/video-probes/worker-generated'
          $p = Start-Process $exe -ArgumentList @('--owned-self-test',"`"$folder`"") -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Persistent owned worker timed out' }
          if ($p.ExitCode -ne 0) { throw "Persistent owned worker exited $($p.ExitCode)" }
          $r = Get-Content "$folder/worker-report.json" -Raw | ConvertFrom-Json
          Write-Output "::notice title=Persistent worker report::$($r | ConvertTo-Json -Compress)"
          if ($r.pictures -ne 90 -or $r.captured_frames -lt 90 -or $r.idrs -lt 2 -or $r.max_pending -gt 2 -or $r.lifecycle_failures -ne 3) { throw 'Persistent worker lifecycle/stream bounds failed' }
          $output = Join-Path $PWD 'target/video-probes/stall-stdout.txt'
          $p = Start-Process $exe -ArgumentList '--owned-stall-test' -RedirectStandardOutput $output -PassThru -NoNewWindow
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw 'Stalled output did not terminate helper' }
          if ($p.ExitCode -ne 0 -or (Get-Content $output -Raw) -ne 'TF') { throw 'Overlapped output cancellation was not verified' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-windows-video-probe-${{ matrix.os }}
          path: |
            target/video-probes/probe-*.exe
            target/video-probes/worker-*.exe
            target/video-probes/worker-generated/*
            target/video-probes/stall-stdout.txt
            target/video-probes/generated/*
            target/video-probes/build-*.log
          if-no-files-found: warn
  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native Mac SDK probe
        run: |
          set -euo pipefail
          mkdir -p target/video-probes
          if ! swiftc -parse-as-library -swift-version 5 -O scripts/video/probe-macos.swift scripts/video/packet-input.swift -o target/video-probes/probe-macos > target/video-probes/build-mac.log 2>&1; then
            python3 - <<'PYCODE'
          from pathlib import Path
          errors=[line for line in Path('target/video-probes/build-mac.log').read_text().splitlines() if 'error:' in line][:8]
          for line in errors:
              print('::error title=Mac probe build::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYCODE
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-macos-video-probe-binary
          path: target/video-probes/probe-macos
          if-no-files-found: warn
  macos:
    needs: [windows, macos-build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-windows-video-probe-windows-11-arm
          path: target/video-probes/input
      - uses: actions/download-artifact@v4
        with:
          name: experimental-macos-video-probe-binary
          path: target/video-probes
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: Validate direct Windows packets with the Rust protocol
        run: cargo run --locked -p freelane-agent-protocol --example video_check -- target/video-probes/input/generated/packets.flv
      - name: Validate captured Windows packets with the Rust protocol
        run: cargo run --locked -p freelane-agent-protocol --example video_check -- target/video-probes/input/generated/captured-packets.flv
      - name: Validate persistent worker packets with Rust
        run: cargo run --locked -p freelane-agent-protocol --example video_check -- target/video-probes/input/worker-generated/worker-packets.flv --worker
      - name: Exercise native compressed decode and surface
        run: |
          set -euo pipefail
          chmod +x target/video-probes/probe-macos
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          fixture=next(Path('target/video-probes/input').rglob('fixture.mp4'))
          process=subprocess.run(['target/video-probes/probe-macos',str(fixture)],capture_output=True,text=True,timeout=60)
          Path('target/video-probes/mac-stderr.txt').write_text(process.stderr)
          if process.returncode:
              print('::error title=Mac video probe::'+process.stderr[-1600:].replace('\n','%0A'))
              raise SystemExit(process.returncode)
          Path('target/video-probes/mac-report.json').write_text(process.stdout)
          r=json.loads(process.stdout)
          print('::notice title=Mac video capability report::'+json.dumps(r))
          assert r['architecture']=='arm64' and r['decoded_frames']==30 and r['dimensions_verified'] and r['pixel_variation_verified'],r
          failure=subprocess.run(['target/video-probes/probe-macos',str(fixture),'--fail-after-first-submit'],capture_output=True,text=True,timeout=60)
          assert failure.returncode==1 and 'Injected failure after asynchronous submission' in failure.stderr and not failure.stdout,failure
          raw=fixture.with_name('packets.flv')
          direct=subprocess.run(['target/video-probes/probe-macos',str(raw)],capture_output=True,text=True,timeout=60)
          Path('target/video-probes/mac-raw-stderr.txt').write_text(direct.stderr)
          if direct.returncode:
              print('::error title=Mac direct packet probe::'+direct.stderr[-1600:].replace('\n','%0A'))
              raise SystemExit(direct.returncode)
          Path('target/video-probes/mac-raw-report.json').write_text(direct.stdout)
          d=json.loads(direct.stdout)
          print('::notice title=Mac direct packet report::'+json.dumps(d))
          assert d['architecture']=='arm64' and d['direct_packets_verified'] and d['decoded_frames']==30 and d['dimensions_verified'] and d['pixel_variation_verified'] and d['hardware_readback_available'] and d['hardware_decoder_used'],d
          captured=fixture.with_name('captured-packets.flv')
          capture=subprocess.run(['target/video-probes/probe-macos',str(captured)],capture_output=True,text=True,timeout=60)
          Path('target/video-probes/mac-captured-stderr.txt').write_text(capture.stderr)
          if capture.returncode:
              print('::error title=Mac captured packet probe::'+capture.stderr[-1600:].replace('\n','%0A'))
              raise SystemExit(capture.returncode)
          Path('target/video-probes/mac-captured-report.json').write_text(capture.stdout)
          c=json.loads(capture.stdout)
          print('::notice title=Mac captured packet report::'+json.dumps(c))
          assert c['architecture']=='arm64' and c['direct_packets_verified'] and c['decoded_frames']==30 and c['dimensions_verified'] and c['pixel_variation_verified'] and c['hardware_readback_available'] and c['hardware_decoder_used'],c
          for raw_input in (raw,captured):
              failure=subprocess.run(['target/video-probes/probe-macos',str(raw_input),'--fail-after-first-submit'],capture_output=True,text=True,timeout=60)
              assert failure.returncode==1 and 'Injected failure after asynchronous submission' in failure.stderr and not failure.stdout,failure
          PY
      - name: Assess native evidence without promoting x64 to ARM acceptance
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/video -v
          python3 scripts/video/report.py target/video-probes/input/generated/report.json target/video-probes/mac-report.json > target/video-probes/assessment.json
          python3 -c "import json; print('::notice title=Video assessment::'+json.dumps(json.load(open('target/video-probes/assessment.json'))))"
          python3 scripts/video/report.py --direct target/video-probes/input/generated/report.json target/video-probes/mac-raw-report.json > target/video-probes/direct-assessment.json
          python3 -c "import json; r=json.load(open('target/video-probes/direct-assessment.json')); print('::notice title=Direct video assessment::'+json.dumps(r)); assert r['candidate_direct_backend']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-macos-video-probe
          path: |
            target/video-probes/mac-report.json
            target/video-probes/assessment.json
            target/video-probes/direct-assessment.json
            target/video-probes/mac-stderr.txt
            target/video-probes/mac-raw-report.json
            target/video-probes/mac-raw-stderr.txt
            target/video-probes/mac-captured-report.json
            target/video-probes/mac-captured-stderr.txt
          if-no-files-found: warn
