name: Experimental release packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*-preview.*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-macos-release.sh'
permissions:
  contents: read
jobs:
  macos-arm64:
    name: Mac Apple Silicon app
    # GitHub's current macos-15 label is Apple Silicon (runner-images catalog).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin
      - name: Build, ad-hoc sign, verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          if bash scripts/build-macos-release.sh 2>&1 | tee target/macos-release-build.log; then
            echo 'Mac package checks passed'
          else
            python3 - <<'PY'
          from pathlib import Path
          message = '\n'.join(Path('target/macos-release-build.log').read_text(errors='replace').splitlines()[-25:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Mac release failure::' + message)
          PY
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLane-experimental-macos-arm64
          path: |
            target/packages/*.zip
            target/packages/*.zip.sha256
            target/packages/*.dmg
            target/packages/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30
  windows-agent:
    name: Windows ARM64 agent and video helper package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-pc-windows-msvc
      - name: Package static-CRT agent, capture helper, checksums and notices
        shell: pwsh
        run: ./scripts/build-windows-agent-native.ps1 -Version $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLane-release-windows-arm64-agent
          path: target/packages/*
          if-no-files-found: error
  publish:
    name: Publish experimental GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos-arm64, windows-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FreeLane-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && for checksum in *.sha256; do sha256sum --check "$checksum"; done)
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.dmg release-assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "FreeLane $GITHUB_REF_NAME — Apple Silicon preview" \
            --notes-file docs/release-notes-preview.md
