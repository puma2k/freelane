name: Rust and ARM VM checks
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests/mcp -v
      - run: python3 -m unittest discover -s tests -p test_package_notices.py -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Install qemu-img for cloud image file tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install qemu-img for cloud image file tests (Mac)
        if: runner.os == 'macOS'
        run: brew install qemu
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2021 --check tests/fixtures/uefi_guest.rs tests/fixtures/linux_9p_guest.rs tests/fixtures/linux_gpu_guest.rs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 scripts/ci-test-status.py portable
      - run: cargo build --locked --workspace
      - name: Verify native Unicode clipboard on an isolated X11 display
        if: runner.os == 'Linux'
        env:
          FREELANE_CLIPBOARD_TEST_DISPLAY: isolated-ci-xvfb
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' cargo test --locked -p freelane-guest-agent --test clipboard_native -- --ignored
      - name: Verify automatic clipboard on two owned authenticated displays
        if: runner.os == 'Linux'
        run: python3 tests/clipboard_auto_native.py
  arm-emulation:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install signed distribution packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 build-essential procps qemu-system-arm qemu-utils qemu-efi-aarch64 swtpm mtools xorriso seabios
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,aarch64-unknown-uefi
      - run: cargo check --locked --target aarch64-apple-darwin
      - name: Exercise stdio MCP jobs and real ARM/UEFI VM controls
        env:
          FREELANE_TEST_FIRMWARE: /usr/share/AAVMF/AAVMF_CODE.fd
          FREELANE_TEST_NVRAM: /usr/share/AAVMF/AAVMF_VARS.fd
        run: |
          cargo build --locked
          python3 scripts/ci-test-status.py arm
      - name: Exercise offline checkpoint file roundtrip
        run: python3 tests/checkpoint_real.py
  guest-agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-pc-windows-msvc
      - run: python3 scripts/ci-test-status.py guest
      - run: cargo check --locked -p freelane-guest-agent --target aarch64-pc-windows-msvc
  guest-agent-arm64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: bash scripts/build-windows-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-windows-arm64-agent
          path: target/guest-agent-arm64/
  guest-agent-linux-arm64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: bash scripts/build-linux-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-arm64-agent
          path: target/guest-agent-linux-arm64/

  checkpoint-macos:
    name: Offline checkpoint files on Mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: brew install qemu
      - run: cargo build --locked -p freelane
      - run: python3 tests/checkpoint_real.py
